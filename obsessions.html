<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>current obsessions — cusp of cancer</title>
<meta name="description" content="A collection of current obsessions.">
<style>
:root { --paper: #f8f7f4; --ink: #252421; --muted: #85817a; --line: #dedbd5; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 13px Arial, Helvetica, sans-serif; }
a { color: inherit; text-decoration: none; }
header { padding: 25px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
.logo { font: 23px Georgia, serif; letter-spacing: -1px; }
nav { display: flex; gap: 24px; font-size: 11px; }
nav a:hover { color: var(--muted); }
.intro { padding: 65px 5% 42px; }
h1 { margin: 0; font: normal clamp(38px, 5vw, 58px) Georgia, serif; letter-spacing: -2px; }
.obsession-grid { padding: 0 5% 90px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 44px 20px; align-items: start; }
.obsession-card { min-width: 0; }
.obsession-image, .obsession-video { display: block; width: 100%; height: auto; background: #e8e5df; }
.youtube-frame { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #e8e5df; }
.obsession-category { margin: 15px 0 7px; color: var(--muted); font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; }
.obsession-card h2 { margin: 0 0 8px; font: normal 22px/1.25 Georgia, serif; }
.obsession-note { margin: 0; color: #66625c; font-size: 11px; line-height: 1.7; white-space: pre-line; }
.obsession-date { display: block; margin-top: 12px; color: var(--muted); font-size: 9px; letter-spacing: .5px; text-transform: uppercase; }
.obsession-link { display: inline-block; margin-top: 15px; padding-bottom: 4px; border-bottom: 1px solid var(--ink); font-size: 10px; letter-spacing: .7px; text-transform: uppercase; }
.obsession-link:hover { color: var(--muted); border-color: var(--muted); }
.empty-message { grid-column: 1 / -1; padding: 20px 0; color: var(--muted); font-size: 11px; }
.about-footer { border-top: 1px solid var(--line); padding: 55px 5%; display: flex; align-items: center; gap: 28px; }
.portrait-placeholder { width: 100px; height: 120px; flex: 0 0 auto; background: #e8e5df; display: grid; place-items: center; color: var(--muted); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
.about-copy { max-width: 360px; }
.about-copy h2 { margin: 0 0 10px; font: normal 21px Georgia, serif; }
.about-copy p { margin: 0; color: #66625c; font-size: 11px; line-height: 1.8; }
footer { border-top: 1px solid var(--line); padding: 25px 5%; display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }
@media (max-width: 900px) { .obsession-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 650px) {
  header { padding: 22px 18px; align-items: flex-start; gap: 15px; }
  .logo { font-size: 20px; }
  nav { gap: 12px; flex-wrap: wrap; justify-content: flex-end; font-size: 10px; }
  .intro { padding: 45px 18px 30px; }
  .obsession-grid { grid-template-columns: 1fr; gap: 35px; padding: 0 18px 65px; }
  .obsession-card h2 { font-size: 21px; }
  .about-footer { padding: 42px 18px; gap: 18px; }
  .portrait-placeholder { width: 82px; height: 102px; }
  footer { padding: 22px 18px; }
}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">cusp of cancer</a>
  <nav>
    <a href="index.html">home</a>
    <a href="archive.html">archive</a>
    <a href="blog.html">blog</a>
    <a href="obsessions.html" aria-current="page">obsessions</a>
    <a href="moodboard.html">mood board</a>
  </nav>
</header>
<main>
  <section class="intro"><h1>Current Obsessions</h1></section>
  <section class="obsession-grid" id="obsessions-grid" aria-label="Current obsessions">
  </section>
  
</main>
<footer>
  <span>© 2026 Cusp of Cancer</span>
  <span>Made in Seattle</span>
</footer>
<script>
const obsessionCategories = ['Fashion', 'Film', 'Music', 'Books', 'Random'];

function safeExternalUrl(value) {
  if (!value) return '';
  try {
    const url = new URL(value, window.location.href);
    return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : '';
  } catch {
    return '';
  }
}

function youtubeEmbedUrl(value) {
  if (!value) return '';
  try {
    const url = new URL(value);
    let id = '';
    if (url.hostname === 'youtu.be' || url.hostname === 'www.youtu.be') {
      id = url.pathname.split('/').filter(Boolean)[0] || '';
    } else if (['youtube.com', 'www.youtube.com', 'm.youtube.com', 'youtube-nocookie.com', 'www.youtube-nocookie.com'].includes(url.hostname)) {
      if (url.pathname === '/watch') id = url.searchParams.get('v') || '';
      else if (/^\/(embed|shorts)\//.test(url.pathname)) id = url.pathname.split('/')[2] || '';
    }
    return /^[A-Za-z0-9_-]{11}$/.test(id) ? 'https://www.youtube-nocookie.com/embed/' + id : '';
  } catch {
    return '';
  }
}

function formatDate(value) {
  if (!value) return '';
  const date = new Date(value + 'T12:00:00');
  return Number.isNaN(date.getTime())
    ? ''
    : date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

async function loadObsessions() {
  const container = document.getElementById('obsessions-grid');
  try {
    const response = await fetch('./content/obsessions.json?updated=' + Date.now());
    if (!response.ok) throw new Error('Obsession entries not found');
    const entries = await response.json();
    const items = Array.isArray(entries) ? entries.filter(item => item && (item.title || item.image || item.video || item.youtube || item.description)) : [];
    container.innerHTML = '';

    if (items.length === 0) {
      container.innerHTML = '';
      return;
    }

    items.forEach(item => {
      const card = document.createElement('article');
      card.className = 'obsession-card';

      if (item.image) {
        const image = document.createElement('img');
        image.className = 'obsession-image';
        image.src = item.image;
        image.alt = item.imageAlt || item.title || 'Current obsession';
        image.loading = 'lazy';
        card.appendChild(image);
      }

      const embedUrl = youtubeEmbedUrl(item.youtube);
      if (embedUrl) {
        const frame = document.createElement('iframe');
        frame.className = 'youtube-frame';
        frame.src = embedUrl;
        frame.title = item.title ? 'YouTube video: ' + item.title : 'YouTube video';
        frame.loading = 'lazy';
        frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        frame.allowFullscreen = true;
        frame.referrerPolicy = 'strict-origin-when-cross-origin';
        card.appendChild(frame);
      }

      if (item.video) {
        const video = document.createElement('video');
        video.className = 'obsession-video';
        video.src = item.video;
        video.controls = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.setAttribute('aria-label', item.title || 'Current obsession video');
        card.appendChild(video);
      }

      const categoryValue = obsessionCategories.includes(item.category) ? item.category : '';
      if (categoryValue) {
        const category = document.createElement('p');
        category.className = 'obsession-category';
        category.textContent = categoryValue;
        card.appendChild(category);
      }

      if (item.title) {
        const title = document.createElement('h2');
        title.textContent = item.title;
        card.appendChild(title);
      }

      if (item.description) {
        const note = document.createElement('p');
        note.className = 'obsession-note';
        note.textContent = item.description;
        card.appendChild(note);
      }

      const linkUrl = safeExternalUrl(item.link);
      if (linkUrl) {
        const link = document.createElement('a');
        link.className = 'obsession-link';
        link.href = linkUrl;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = item.linkLabel || 'Explore';
        card.appendChild(link);
      }

      const dateLabel = formatDate(item.date);
      if (dateLabel) {
        const date = document.createElement('time');
        date.className = 'obsession-date';
        date.dateTime = item.date;
        date.textContent = dateLabel;
        card.appendChild(date);
      }
      container.appendChild(card);
    });
  } catch (error) {
    console.error('Could not load obsessions:', error);
    container.innerHTML = '';
  }
}
loadObsessions();
</script>
</body>
</html>
