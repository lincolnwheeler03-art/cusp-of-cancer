<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mood board — cusp of cancer</title>
<meta name="description" content="A visual mood board for Cusp of Cancer.">
<style>
:root { --paper: #f8f7f4; --ink: #252421; --muted: #85817a; --line: #dedbd5; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 13px Arial, Helvetica, sans-serif; }
a { color: inherit; text-decoration: none; }
header { padding: 25px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
.logo { font: 23px Georgia, serif; letter-spacing: -1px; }
nav { display: flex; gap: 24px; font-size: 11px; }
nav a:hover { color: var(--muted); }
main { min-height: 65vh; padding: 65px 5% 90px; }
h1 { margin: 0 0 12px; font: normal clamp(38px, 5vw, 58px) Georgia, serif; letter-spacing: -2px; }
.intro { margin: 0 0 35px; color: var(--muted); font-size: 11px; line-height: 1.7; }
.board-embed { min-height: 360px; display: flex; justify-content: center; overflow-x: auto; padding: 10px 0; }
.board-embed a { display: block; margin: 0 auto; }
.board-link { display: inline-block; margin-top: 20px; color: var(--muted); font-size: 11px; text-decoration: underline; text-underline-offset: 3px; }
footer { border-top: 1px solid var(--line); padding: 25px 5%; display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }
@media (max-width: 650px) {
 header { padding: 22px 18px; align-items: flex-start; gap: 15px; }
 .logo { font-size: 20px; }
 nav { gap: 12px; flex-wrap: wrap; justify-content: flex-end; font-size: 10px; }
 main { padding: 45px 18px 65px; }
 .board-embed { min-height: 280px; }
 footer { padding: 22px 18px; }
}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">cusp of cancer</a>
  <nav>
    <a href="index.html">home</a>
    <a href="archive.html">archive</a>
    <a href="blog.html">blog</a>
    <a href="obsessions.html">obsessions</a>
    <a href="moodboard.html" aria-current="page">mood board</a>
  </nav>
</header>
<main>
  <h1>Mood Board</h1>
  <p class="intro">A collection of images and ideas saved to Pinterest.</p>
  <section class="board-embed" aria-label="Pinterest mood board">
    <a data-pin-do="embedBoard"
       data-pin-board-width="900"
       data-pin-scale-height="240"
       data-pin-scale-width="80"
       href="https://www.pinterest.com/lincolnwheeler_/mood-board/">
    </a>
  </section>
  <a class="board-link" href="https://www.pinterest.com/lincolnwheeler_/mood-board/" target="_blank" rel="noopener noreferrer">
    View the board on Pinterest
  </a>
</main>
<footer>
  <span>cusp of cancer © 2026</span>
  <span>a little corner of the internet.</span>
</footer>
<script async defer src="https://assets.pinterest.com/js/pinit.js"></script>
</body>
</html>
