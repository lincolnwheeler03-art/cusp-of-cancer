<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mood board — cusp of cancer</title>
<meta name="description" content="A visual mood board for Cusp of Cancer.">
<style>
:root { --paper: #f8f7f4; --ink: #252421; --muted: #85817a; --line: #dedbd5; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 13px Arial, Helvetica, sans-serif; }
a { color: inherit; text-decoration: none; }
header { padding: 25px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
.logo { font: 23px Georgia, serif; letter-spacing: -1px; }
nav { display: flex; gap: 24px; font-size: 11px; }
nav a:hover { color: var(--muted); }
main { min-height: 65vh; padding: 65px 5% 90px; }
h1 { margin: 0 0 12px; font: normal clamp(38px, 5vw, 58px) Georgia, serif; letter-spacing: -2px; }
.intro { margin: 0 0 35px; color: var(--muted); font-size: 11px; line-height: 1.7; }
.moodboard-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.moodboard-item { min-width: 0; margin: 0; }
.moodboard-image { display: block; width: 100%; height: auto; }
.moodboard-item figcaption { padding-top: 9px; color: var(--muted); font-size: 10px; line-height: 1.6; }
.gallery-empty { grid-column: 1 / -1; padding: 30px 0; color: var(--muted); font-size: 11px; }
footer { border-top: 1px solid var(--line); padding: 25px 5%; display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }
@media (max-width: 650px) {
 header { padding: 22px 18px; align-items: flex-start; gap: 15px; }
 .logo { font-size: 20px; }
 nav { gap: 12px; flex-wrap: wrap; justify-content: flex-end; font-size: 10px; }
 main { padding: 45px 18px 65px; }
 .moodboard-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
 .gallery-empty { padding: 24px 0; }
 footer { padding: 22px 18px; }
}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">cusp of cancer</a>
  <nav>
    <a href="index.html">home</a>
    <a href="archive.html">archive</a>
    <a href="blog.html">blog</a>
    <a href="obsessions.html">obsessions</a>
    <a href="moodboard.html" aria-current="page">mood board</a>
  </nav>
</header>
<main>
  <h1>Mood Board</h1>
  <p class="intro">A collection of images and ideas.</p>
  <section class="moodboard-grid" id="moodboard-grid" aria-label="Mood board images">
    <p class="gallery-empty">The mood board is ready for images.</p>
  </section>
</main>
<footer>
  <span>cusp of cancer © 2026</span>
  <span>Lorem ipsum dolor sit amet.</span>
</footer>
<script>
async function loadMoodboard() {
  const gallery = document.getElementById('moodboard-grid');

  try {
    const response = await fetch('./content/moodboard.json');
    if (!response.ok) throw new Error('Mood Board images not found');

    const records = await response.json();
    const items = Array.isArray(records)
      ? records.flatMap(record => {
          if (!record) return [];
          const sources = Array.isArray(record.images)
            ? record.images
            : record.image ? [record.image] : [];

          return sources.map(source => {
            const src = typeof source === 'string'
              ? source
              : source && (source.src || source.path) || '';
            return src ? { src, alt: record.alt || '' } : null;
          }).filter(Boolean);
        })
      : [];

    gallery.innerHTML = '';

    if (items.length === 0) {
      gallery.innerHTML = '<p class="gallery-empty">The mood board is ready for images.</p>';
      return;
    }

    items.forEach(item => {
      const figure = document.createElement('figure');
      figure.className = 'moodboard-item';

      const image = document.createElement('img');
      image.className = 'moodboard-image';
      image.src = item.src;
      image.alt = item.alt || item.src.split('/').pop().replace(/[-_]/g, ' ').replace(/\.[^.]+$/, '') || 'Mood board image';
      image.loading = 'lazy';
      figure.appendChild(image);

      gallery.appendChild(figure);
    });
  } catch (error) {
    console.error('Could not load Mood Board images:', error);
    gallery.innerHTML = '<p class="gallery-empty">The mood board is ready for images.</p>';
  }
}

loadMoodboard();
</script>
</body>
</html>
