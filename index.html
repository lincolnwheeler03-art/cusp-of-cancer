
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cusp of cancer</title>
<meta name="description" content="A personal collection of photographs, thoughts and current obsessions.">

<style>
:root {
  --paper: #f8f7f4;
  --ink: #252421;
  --muted: #85817a;
  --line: #dedbd5;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;
}

a {
  color: inherit;
  text-decoration: none;
}

header {
  padding: 25px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
}

.logo {
  font-family: Georgia, serif;
  font-size: 23px;
  letter-spacing: -1px;
}

nav {
  display: flex;
  gap: 24px;
  font-size: 11px;
}

nav a:hover { color: var(--muted); }

.feed {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: start;
  gap: 45px 22px;
  padding: 35px 5% 90px;
}


.post {
  min-width: 0;
  margin: 0;
}

.post img,
.post video {
  display: block;
  width: 100%;
  height: auto;
  background: #e8e5df;
}

.post figcaption {
  padding-top: 11px;
  line-height: 1.6;
  font-size: 11px;
  color: #66625c;
}

.post figcaption span {
  display: block;
  color: var(--muted);
  font-size: 9px;
  margin-top: 4px;
  letter-spacing: .5px;
}

.empty-message {
  grid-column: 1 / -1;
  color: var(--muted);
  padding: 30px 0;
}

footer {
  border-top: 1px solid var(--line);
  padding: 25px 5%;
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 10px;
}

@media (max-width: 650px) {
  header {
    padding: 22px 18px;
    align-items: flex-start;
    gap: 15px;
  }

  .logo { font-size: 20px; }

  nav {
    gap: 12px;
    font-size: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .feed {
    display: flex;
    flex-direction: column;
    gap: 35px;
    padding: 0 0 65px;
  }

  .post {
    width: 100%;
  }

  .post img {
    width: 100%;
    height: auto;
  }

  .post figcaption {
    padding: 11px 18px 0;
  }

  footer {
    padding: 22px 18px;
  }
}

.post-image-button {
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: zoom-in;
}

.archive-item {
  padding: 0;
  border: 0;
  cursor: zoom-in;
}

.image-lightbox[hidden] { display: none; }

.image-lightbox {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px 24px;
  background: rgba(20, 19, 17, .92);
  cursor: zoom-out;
}

.image-lightbox-image {
  display: block;
  max-width: 96vw;
  max-height: calc(100vh - 72px);
  width: auto;
  height: auto;
  object-fit: contain;
  cursor: default;
}

.image-lightbox-close {
  position: absolute;
  top: 14px;
  right: 20px;
  width: 42px;
  height: 42px;
  border: 1px solid rgba(255, 255, 255, .65);
  border-radius: 50%;
  background: transparent;
  color: #fff;
  font: 30px/1 Arial, Helvetica, sans-serif;
  cursor: pointer;
}

.post-image-button:focus-visible,
.archive-item:focus-visible,
.image-lightbox-close:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 4px;
}

</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">cusp of cancer</a>

  <nav>
    <a href="index.html">home</a>
    <a href="archive.html">archive</a>
    <a href="blog.html">blog</a>
    <a href="obsessions.html">obsessions</a>
      <a href="moodboard.html">mood board</a>
  </nav>
</header>

<main>
  <section class="feed" id="posts-container"></section>
</main>

<footer>
  <span>cusp of cancer © 2026</span>
  <span>Lorem ipsum dolor sit amet.</span>
</footer>


<div class="image-lightbox" id="image-lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <button class="image-lightbox-close" type="button" aria-label="Close image">×</button>
  <img class="image-lightbox-image" alt="">
</div>

<script>
async function loadPosts() {
  const container = document.getElementById('posts-container');

  try {
    const response = await fetch('./content/posts.json');
    if (!response.ok) throw new Error('Posts not found');

    const posts = await response.json();

    const visualPosts = posts
      .filter(post =>
        ((post.type === 'photo' || post.type === 'gif') && post.image) ||
        (post.type === 'video' && post.video)
      )
      .sort((a, b) => new Date(b.date) - new Date(a.date))
      .slice(0, 14);

    if (visualPosts.length === 0) {
      container.innerHTML =
        '<p class="empty-message">New photographs coming soon.</p>';
      return;
    }

    visualPosts.forEach(post => {
      const article = document.createElement('figure');
      article.className = 'post';

      if (post.type === 'video' && post.video) {
        const video = document.createElement('video');
        video.src = post.video;
        video.controls = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.setAttribute('aria-label', post.caption || 'Cusp of Cancer video');
        if (post.poster) video.poster = post.poster;
        article.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = post.image;
        img.alt = post.caption || 'Cusp of Cancer photograph';
        img.loading = 'lazy';
        const imageButton = document.createElement('button');
        imageButton.type = 'button';
        imageButton.className = 'post-image-button';
        imageButton.setAttribute('aria-label', 'Open image: ' + img.alt);
        imageButton.appendChild(img);
        article.appendChild(imageButton);
      }

      const caption = document.createElement('figcaption');
      caption.textContent = post.caption || '';

      if (post.date) {
        const date = document.createElement('span');
        date.textContent = post.date;
        caption.appendChild(date);
      }

      article.appendChild(caption);
      container.appendChild(article);
    });

  } catch (error) {
    console.error('Could not load posts:', error);
    container.innerHTML =
      '<p class="empty-message">Unable to load posts.</p>';
  }
}

loadPosts();

const imageLightbox = document.getElementById('image-lightbox');
const imageLightboxImage = imageLightbox.querySelector('.image-lightbox-image');
const imageLightboxClose = imageLightbox.querySelector('.image-lightbox-close');
let lastFocusedImageButton = null;

function openImageLightbox(button) {
  const image = button.querySelector('img');
  if (!image) return;

  lastFocusedImageButton = button;
  imageLightboxImage.src = image.src;
  imageLightboxImage.alt = image.alt;
  imageLightbox.hidden = false;
  document.body.style.overflow = 'hidden';
  imageLightboxClose.focus();
}

function closeImageLightbox() {
  imageLightbox.hidden = true;
  imageLightboxImage.removeAttribute('src');
  document.body.style.overflow = '';
  if (lastFocusedImageButton && lastFocusedImageButton.isConnected) {
    lastFocusedImageButton.focus();
  }
}

document.addEventListener('click', event => {
  const button = event.target.closest('.post-image-button, .archive-item[type="button"]');
  if (button) openImageLightbox(button);
});

imageLightboxClose.addEventListener('click', closeImageLightbox);
imageLightbox.addEventListener('click', event => {
  if (event.target === imageLightbox) closeImageLightbox();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !imageLightbox.hidden) closeImageLightbox();
});

</script>

</body>
</html>
