
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cusp of cancer</title>
<meta name="description" content="Cusp of Cancer — articles and writing.">

<style>
:root {
  --paper: #f8f7f4;
  --ink: #222;
  --muted: #888;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
}

header {
  padding: 30px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  border-bottom: 1px solid #e8e6e1;
}

.logo {
  font-size: 22px;
  letter-spacing: -1px;
  text-decoration: none;
  color: var(--ink);
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  font-family: Arial, sans-serif;
  font-size: 12px;
}

nav a {
  color: var(--ink);
  text-decoration: none;
}

main {
  max-width: 760px;
  margin: 90px auto;
  padding: 0 24px;
}

.back {
  font-family: Arial, sans-serif;
  font-size: 12px;
  color: var(--muted);
  text-decoration: none;
}

h1 {
  font-size: clamp(34px, 6vw, 54px);
  font-weight: normal;
  line-height: 1.1;
  margin: 35px 0 15px;
}

.date {
  font-family: Arial, sans-serif;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 45px;
}

.article-content {
  font-size: 18px;
  line-height: 1.85;
}

.article-content p {
  margin: 0 0 28px;
  white-space: pre-line;
}

.article-content img {
  display: block;
  width: 100%;
  height: auto;
  margin: 40px 0;
}

.article-content figure {
  margin: 40px 0;
}

.article-content figcaption {
  font-family: Arial, sans-serif;
  font-size: 11px;
  color: var(--muted);
  margin-top: 10px;
}

.not-found {
  text-align: center;
  padding: 80px 0;
}

footer {
  text-align: center;
  padding: 35px 20px;
  font-family: Arial, sans-serif;
  font-size: 11px;
  color: var(--muted);
}

@media (max-width: 600px) {
  header {
    flex-direction: column;
  }

  nav {
    justify-content: center;
    gap: 14px;
  }

  main {
    margin: 55px auto;
  }

  .article-content {
    font-size: 17px;
  }
}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">cusp of cancer</a>

  <nav>
    <a href="index.html">Home</a>
    <a href="archive.html">Archive</a>
    <a href="blog.html">Blog</a>
    <a href="obsessions.html">Obsessions</a>
      <a href="moodboard.html">Mood Board</a>
  </nav>
</header>

<main id="article">
  <p>Loading article...</p>
</main>

<footer>
  © 2026 Cusp of Cancer
</footer>

<script>
const articleContainer = document.getElementById("article");

function formatDate(dateString) {
  const date = new Date(dateString + "T12:00:00");
  return date.toLocaleDateString("en-US", {
    month: "long",
    day: "numeric",
    year: "numeric"
  });
}

function showNotFound() {
  articleContainer.innerHTML = `
    <div class="not-found">
      <h1>Article not found</h1>
      <a class="back" href="blog.html">Return to the Blog</a>
    </div>
  `;
}

async function loadArticle() {
  const slug = new URLSearchParams(window.location.search).get("slug");

  if (!slug) {
    showNotFound();
    return;
  }

  try {
    const response = await fetch("./content/posts.json");

    if (!response.ok) {
      throw new Error("Could not load posts.");
    }

    const posts = await response.json();

    const post = posts.find(item =>
      item.type === "text" &&
      item.article === true &&
      item.slug === slug
    );

    if (!post) {
      showNotFound();
      return;
    }

    document.title = post.title + " — cusp of cancer";

    articleContainer.innerHTML = "";

    const back = document.createElement("a");
    back.className = "back";
    back.href = "blog.html";
    back.textContent = "← Back to Blog";

    const title = document.createElement("h1");
    title.textContent = post.title || "";

    const date = document.createElement("div");
    date.className = "date";
    date.textContent = formatDate(post.date);

    const content = document.createElement("div");
    content.className = "article-content";

    (post.content || []).forEach(block => {
      if (block.type === "paragraph") {
        const paragraph = document.createElement("p");
        paragraph.textContent = block.text || "";
        content.appendChild(paragraph);
      }

      if (block.type === "image") {
        const figure = document.createElement("figure");

        const image = document.createElement("img");
        image.src = block.src;
        image.alt = block.alt || "";
        image.loading = "lazy";

        figure.appendChild(image);

        if (block.caption) {
          const caption = document.createElement("figcaption");
          caption.textContent = block.caption;
          figure.appendChild(caption);
        }

        content.appendChild(figure);
      }
    });

    articleContainer.append(back, title, date, content);

  } catch (error) {
    showNotFound();
  }
}

loadArticle();
</script>

</body>
</html>
