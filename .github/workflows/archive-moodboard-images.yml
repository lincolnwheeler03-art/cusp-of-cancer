name: Archive Mood Board images

on:
  push:
    branches:
      - main
    paths:
      - content/moodboard.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moodboard-archive-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  archive-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the publishing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Add new images to the permanent archive
        run: python3 scripts/archive_moodboard_images.py
      - name: Save archive additions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/moodboard-archive.json
          if git diff --cached --quiet; then
            echo "No new Mood Board images to archive."
            exit 0
          fi
          git commit -m "Archive new Mood Board images"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
