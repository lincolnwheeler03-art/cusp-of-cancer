media:
  input: media
  output: /cusp-of-cancer/media

content:
  - name: posts
    label: Posts
    type: file
    path: content/posts.json
    format: json
    list: true
    fields:
      - name: type
        label: Post type
        type: select
        required: true
        options:
          values:
            - photo
            - gif
            - text

      - name: image
        label: Photo or GIF
        type: image

      - name: caption
        label: Caption or short text
        type: text

      - name: article
        label: Long article
        type: boolean

      - name: slug
        label: Article URL slug
        type: string

      - name: title
        label: Article title
        type: string

      - name: excerpt
        label: Article excerpt
        type: text

      - name: content
        label: Article content blocks
        type: object
        list: true
        fields:
          - name: type
            label: Block type
            type: select
            required: true
            options:
              values:
                - paragraph
                - image

          - name: text
            label: Paragraph text
            type: text

          - name: src
            label: Article image
            type: image

          - name: alt
            label: Image description
            type: string

          - name: caption
            label: Image caption
            type: string

      - name: date
        label: Post date
        type: date
        required: true

  - name: moodboard
    label: Mood Board images
    type: file
    path: content/moodboard.json
    format: json
    list: true
    fields:
      - name: image
        label: Image
        type: image
        required: true

      - name: alt
        label: Image description
        type: string

      - name: caption
        label: Caption
        type: string
