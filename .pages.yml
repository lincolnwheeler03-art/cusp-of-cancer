media:
  input: media
  output: /cusp-of-cancer/media

content:
  - name: posts
    label: Posts
    type: file
    path: content/posts.json
    format: json
    list: true
    fields:
      - name: type
        label: Post type
        type: select
        required: true
        options:
          values: [photo, gif, video, text]
      - name: image
        label: Photo or GIF
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, gif]
      - name: video
        label: Video file (MP4 or WebM)
        type: file
        description: Keep each clip under 50 MiB. GitHub blocks individual files larger than 100 MiB.
        options:
          categories: [video]
          extensions: [mp4, webm]
      - name: poster
        label: Video poster image
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, gif]
      - name: caption
        label: Caption or short text
        type: text
      - name: article
        label: Long article
        type: boolean
      - name: slug
        label: Article URL slug
        type: string
      - name: title
        label: Article title
        type: string
      - name: excerpt
        label: Article excerpt
        type: text
        description: A short preview shown on the Blog page.
      - name: body
        label: Article body
        type: rich-text
        description: Write the full article here. Use the formatting toolbar to add headings, emphasis, links, lists, and images.
        options:
          format: html
          path: media
          switcher: true
      - name: content
        label: Legacy article content blocks
        type: object
        hidden: true
        list: true
        fields:
          - name: type
            label: Block type
            type: select
            required: true
            options:
              values: [paragraph, image, video]
          - name: text
            label: Paragraph text
            type: text
          - name: src
            label: Article image
            type: image
            options:
              extensions: [jpg, jpeg, png, webp, gif]
          - name: video
            label: Video file (MP4 or WebM)
            type: file
            description: Keep each clip under 50 MiB. GitHub blocks individual files larger than 100 MiB.
            options:
              categories: [video]
              extensions: [mp4, webm]
          - name: alt
            label: Image description
            type: string
          - name: caption
            label: Image caption
            type: string
      - name: date
        label: Post date
        type: date
        required: true

  - name: moodboard
    label: Mood Board images
    type: file
    path: content/moodboard.json
    format: json
    list: true
    fields:
      - name: images
        label: Images (select multiple)
        type: image
        required: true
        options:
          multiple:
            max: 100
          extensions: [jpg, jpeg, png, webp, gif]
      - name: alt
        label: Shared image description
        type: string

  - name: obsessions
    label: Current Obsessions
    type: file
    path: content/obsessions.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        description: Optional for a text-only note; add a title or a note so the entry has something to display.
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [Fashion, Film, Music, Books, Random]
      - name: image
        label: Image or GIF (optional)
        type: image
        options:
          extensions: [jpg, jpeg, png, webp, gif]
      - name: imageAlt
        label: Image description
        type: string
      - name: video
        label: Upload video file (MP4 or WebM)
        type: file
        description: Optional. Keep each clip under 50 MiB. GitHub blocks individual files larger than 100 MiB.
        options:
          categories: [video]
          extensions: [mp4, webm]
      - name: youtube
        label: YouTube video URL (optional)
        type: string
        description: Paste a regular YouTube watch, youtu.be, or embed URL.
      - name: description
        label: Note or text (optional)
        type: text
      - name: link
        label: Link URL
        type: string
      - name: linkLabel
        label: Link label (e.g. Watch, Read, Listen)
        type: string
      - name: date
        label: Date added
        type: date
