media:
  input: media
  output: /cusp-of-cancer/media

content:
  - name: posts
    label: Posts
    type: file
    path: content/posts.json
    format: json
    list: true
    fields:
      - name: type
        label: Post type
        type: select
        options:
          values:
            - photo
            - gif
            - text

      - name: image
        label: Photo or GIF
        type: image

      - name: caption
        label: Caption or short post
        type: text

      - name: article
        label: Long post
        type: boolean

      - name: slug
        label: Article URL slug
        type: string

      - name: title
        label: Article title
        type: string

      - name: excerpt
        label: Article excerpt
        type: text

      - name: content
        label: Article content blocks
        type: list
        fields:
          - name: type
            label: Block type
            type: select
            options:
              values:
                - paragraph
                - image

          - name: text
            label: Paragraph text
            type: text

          - name: src
            label: Image
            type: image

          - name: alt
            label: Image description
            type: string

          - name: caption
            label: Image caption
            type: string

      - name: date
        label: Date
        type: date
