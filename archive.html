
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>archive — cusp of cancer</title>
<meta name="description" content="The complete photographic archive of Cusp of Cancer.">

<style>
:root {
  --paper: #f8f7f4;
  --ink: #252421;
  --muted: #85817a;
  --line: #dedbd5;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;
}

a {
  color: inherit;
  text-decoration: none;
}

header {
  padding: 25px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
}

.logo {
  font-family: Georgia, serif;
  font-size: 23px;
  letter-spacing: -1px;
}

nav {
  display: flex;
  gap: 24px;
  font-size: 11px;
}

nav a:hover {
  color: var(--muted);
}

.intro {
  padding: 65px 5% 45px;
}

.intro h1 {
  font-family: Georgia, serif;
  font-weight: normal;
  font-size: clamp(38px, 5vw, 58px);
  letter-spacing: -2px;
  margin: 0 0 12px;
}

.intro p {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
  margin: 0;
}

.section-label {
  padding: 0 5% 18px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.archive-grid {
  padding: 0 5% 90px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.archive-item {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  background: #e8e5df;
}

.archive-item img,
.archive-item video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .35s ease;
}

.archive-item:hover img {
  transform: scale(1.035);
}

.empty-message {
  grid-column: 1 / -1;
  color: var(--muted);
  padding: 30px 0;
}

footer {
  border-top: 1px solid var(--line);
  padding: 25px 5%;
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 10px;
}

@media (max-width: 900px) {
  .archive-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 650px) {
  header {
    padding: 22px 18px;
    align-items: flex-start;
    gap: 15px;
  }

  .logo {
    font-size: 20px;
  }

  nav {
    gap: 12px;
    font-size: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .intro {
    padding: 45px 18px 35px;
  }

  .intro h1 {
    font-size: 39px;
  }

  .section-label {
    padding: 0 18px 14px;
  }

  .archive-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5px;
    padding: 0 0 65px;
  }

  footer {
    padding: 22px 18px;
  }
}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">cusp of cancer</a>

  <nav>
    <a href="index.html">home</a>
    <a href="archive.html">archive</a>
    <a href="blog.html">blog</a>
    <a href="obsessions.html">obsessions</a>
      <a href="moodboard.html">mood board</a>
  </nav>
</header>

<main>
  <section class="intro">
    <h1>Archive</h1>
    <p>The complete collection.</p>
  </section>

  <div class="section-label">All photographs &amp; moving images</div>

  <section class="archive-grid" id="posts-container">
    <p class="empty-message">Loading collection...</p>
  </section>
</main>

<footer>
  <span>cusp of cancer © 2026</span>
  <span>Lorem ipsum dolor sit amet.</span>
</footer>

<script>
async function loadPosts() {
  const container = document.getElementById('posts-container');

  try {
    const response = await fetch('./content/posts.json');
    if (!response.ok) throw new Error('Posts not found');

    const posts = await response.json();

    const visualPosts = posts
      .filter(post =>
        ((post.type === 'photo' || post.type === 'gif') && post.image) ||
        (post.type === 'video' && post.video)
      )
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    container.innerHTML = '';

    if (visualPosts.length === 0) {
      container.innerHTML =
        '<p class="empty-message">The collection is waiting to begin.</p>';
      return;
    }

    visualPosts.forEach(post => {
      if (post.type === 'video' && post.video) {
        const item = document.createElement('div');
        item.className = 'archive-item';

        const video = document.createElement('video');
        video.src = post.video;
        video.controls = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.setAttribute('aria-label', post.caption || 'Cusp of Cancer video');
        if (post.poster) video.poster = post.poster;

        item.appendChild(video);
        container.appendChild(item);
        return;
      }

      const item = document.createElement('a');
      item.className = 'archive-item';
      item.href = post.image;
      item.target = '_blank';
      item.rel = 'noopener';

      const img = document.createElement('img');
      img.src = post.image;
      img.alt = post.caption || 'Cusp of Cancer photograph';
      img.loading = 'lazy';

      item.appendChild(img);
      container.appendChild(item);
    });

  } catch (error) {
    container.innerHTML =
      '<p class="empty-message">The collection could not be loaded.</p>';
    console.error('Could not load posts:', error);
  }
}

loadPosts();
</script>

</body>
</html>
