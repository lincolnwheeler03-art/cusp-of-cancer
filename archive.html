
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>archive — cusp of cancer</title>
<meta name="description" content="The complete running collection of Cusp of Cancer.">

<style>
:root {
  --paper: #f8f7f4;
  --ink: #252421;
  --muted: #85817a;
  --line: #dedbd5;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;
}

a { color: inherit; text-decoration: none; }

header {
  padding: 25px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
}

.logo {
  font-family: Georgia, serif;
  font-size: 23px;
  letter-spacing: -1px;
}

nav {
  display: flex;
  gap: 24px;
  font-size: 11px;
}

nav a:hover { color: var(--muted); }

.intro {
  padding: 65px 5% 55px;
}

.intro h1 {
  font-family: Georgia, serif;
  font-weight: normal;
  font-size: clamp(38px, 5vw, 58px);
  letter-spacing: -2px;
  margin: 0 0 12px;
}

.intro p {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
  margin: 0;
}

.section-label {
  padding: 0 5% 18px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}


.feed {
  padding: 0 5% 90px;
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-auto-rows: 8px;
  grid-auto-flow: row;
  column-gap: 22px;
  row-gap: 38px;
  align-items: start;
}

/* Let individual posts participate in the feed grid */
.feed > #posts-container {
  display: contents;
}

.post {
  min-width: 0;
  margin: 0;
}

.post img {
  display: block;
  width: 100%;
  height: auto;
  background: #e8e5df;
}

.post figcaption {
  padding-top: 11px;
  line-height: 1.6;
  font-size: 11px;
  color: #66625c;
}

.post figcaption span {
  color: var(--muted);
  display: block;
  font-size: 9px;
  margin-top: 4px;
  letter-spacing: .5px;
}

/* Different widths create the editorial collage */
.post.layout-1 { grid-column: span 5; }
.post.layout-2 { grid-column: span 4; }
.post.layout-3 { grid-column: span 5; }
.post.layout-4 { grid-column: span 4; }
.post.layout-5 { grid-column: span 6; }

.text-post {
  grid-column: span 5;
  min-width: 0;
  padding: 28px;
  margin: 0;
  font-family: Georgia, serif;
  font-size: 25px;
  line-height: 1.4;
  border: 1px solid var(--line);
}

.text-post span {
  display: block;
  font-family: Arial, sans-serif;
  font-size: 9px;
  color: var(--muted);
  margin-top: 18px;
  letter-spacing: 1px;
}

.empty-message {
  grid-column: 1 / -1;
  color: var(--muted);
  padding: 30px 0;
}

  grid-column: 1 / -1;
  color: var(--muted);
  padding: 30px 0;
}

footer {
  border-top: 1px solid var(--line);
  padding: 25px 5%;
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 10px;
}

@media (max-width: 650px) {
  header { padding: 22px 18px; }
  .logo { font-size: 20px; }
  nav { gap: 13px; font-size: 10px; }

  .intro { padding: 45px 18px 35px; }
  .intro h1 { font-size: 39px; }

  .section-label { padding: 0 18px 14px; }

  .feed {
  padding: 0 0 65px;
  display: flex;
  flex-direction: column;
  gap: 38px;
}

.post {
  width: 100%;
  margin: 0;
}

.post img {
  width: 100%;
  height: auto;
}

.post figcaption {
  padding: 11px 18px 0;
}

.text-post {
  width: 100%;
  padding: 25px 18px;
  margin: 0;
  font-size: 23px;
}

  .post { width: 100%; margin: 0 !important; }
  .text-post { width: 100%; padding: 25px 0; margin: 0; font-size: 23px; }

  footer { padding: 22px 18px; }
}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">cusp of cancer</a>
  <nav>
    <a href="index.html">home</a>
    <a href="index.html#obsessions">obsessions</a>
    <a href="archive.html">archive</a>
    <a href="about.html">about</a>
  </nav>
</header>

<main>
  <section class="intro">
    <h1>Archive</h1>
    <p>A collection of things seen, things loved, and things in between.</p>
  </section>

  <div class="section-label">The complete collection</div>

  <section class="feed" id="posts-container">
    <p class="empty-message">Loading collection...</p>
  </section>
</main>

<footer>
  <span>cusp of cancer © 2026</span>
  <span>a little corner of the internet.</span>
</footer>

<script>
async function loadPosts() {
  const container = document.getElementById('posts-container');

  try {
    const response = await fetch('./content/posts.json');
    if (!response.ok) throw new Error('Posts not found');

    const posts = await response.json();
    container.innerHTML = '';

    if (!posts.length) {
      container.innerHTML = '<p class="empty-message">The collection is waiting to begin.</p>';
      return;
    }

    posts.forEach((post) => {
      if (post.type === 'text') {
        const article = document.createElement('article');
        article.className = 'text-post';
        article.textContent = post.caption || '';

        if (post.date) {
          const date = document.createElement('span');
          date.textContent = post.date;
          article.appendChild(date);
        }

        container.appendChild(article);
        return;
      }

      if (!post.image) return;

      const article = document.createElement('figure');
      article.className = 'post';

      const img = document.createElement('img');
      img.src = post.image;
      img.alt = post.caption || 'Cusp of Cancer photograph';
      img.loading = 'lazy';

      const caption = document.createElement('figcaption');
      caption.textContent = post.caption || '';

      if (post.date) {
        const date = document.createElement('span');
        date.textContent = post.date;
        caption.appendChild(date);
      }

      article.appendChild(img);
      article.appendChild(caption);
      container.appendChild(article);
    });

  } catch (error) {
    container.innerHTML = '<p class="empty-message">The collection could not be loaded.</p>';
    console.error('Could not load posts:', error);
  }
}

loadPosts();
</script>

</body>
</html>
