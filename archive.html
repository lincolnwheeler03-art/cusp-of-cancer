
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>archive — cusp of cancer</title>
<meta name="description" content="The complete photographic archive of Cusp of Cancer.">

<style>
:root {
  --paper: #f8f7f4;
  --ink: #252421;
  --muted: #85817a;
  --line: #dedbd5;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;
}

a {
  color: inherit;
  text-decoration: none;
}

header {
  padding: 25px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
}

.logo {
  font-family: Georgia, serif;
  font-size: 23px;
  letter-spacing: -1px;
}

nav {
  display: flex;
  gap: 24px;
  font-size: 11px;
}

nav a:hover {
  color: var(--muted);
}

.intro {
  padding: 65px 5% 45px;
}

.intro h1 {
  font-family: Georgia, serif;
  font-weight: normal;
  font-size: clamp(38px, 5vw, 58px);
  letter-spacing: -2px;
  margin: 0 0 12px;
}

.intro p {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
  margin: 0;
}

.section-label {
  padding: 0 5% 18px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.archive-grid {
  padding: 0 5% 90px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.archive-item {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  background: #e8e5df;
}

.archive-item img,
.archive-item video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .35s ease;
}

.archive-item:hover img {
  transform: scale(1.035);
}

.empty-message {
  grid-column: 1 / -1;
  color: var(--muted);
  padding: 30px 0;
}

footer {
  border-top: 1px solid var(--line);
  padding: 25px 5%;
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 10px;
}

@media (max-width: 900px) {
  .archive-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 650px) {
  header {
    padding: 22px 18px;
    align-items: flex-start;
    gap: 15px;
  }

  .logo {
    font-size: 20px;
  }

  nav {
    gap: 12px;
    font-size: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .intro {
    padding: 45px 18px 35px;
  }

  .intro h1 {
    font-size: 39px;
  }

  .section-label {
    padding: 0 18px 14px;
  }

  .archive-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5px;
    padding: 0 0 65px;
  }

  footer {
    padding: 22px 18px;
  }
}

.post-image-button {
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: zoom-in;
}

.archive-item {
  padding: 0;
  border: 0;
  cursor: zoom-in;
}

.image-lightbox[hidden] { display: none; }

.image-lightbox {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px 24px;
  background: rgba(20, 19, 17, .92);
  cursor: zoom-out;
}

.image-lightbox-image {
  display: block;
  max-width: 96vw;
  max-height: calc(100vh - 72px);
  width: auto;
  height: auto;
  object-fit: contain;
  cursor: default;
}

.image-lightbox-close {
  position: absolute;
  top: 14px;
  right: 20px;
  width: 42px;
  height: 42px;
  border: 1px solid rgba(255, 255, 255, .65);
  border-radius: 50%;
  background: transparent;
  color: #fff;
  font: 30px/1 Arial, Helvetica, sans-serif;
  cursor: pointer;
}

.post-image-button:focus-visible,
.archive-item:focus-visible,
.image-lightbox-close:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 4px;
}

</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">cusp of cancer</a>

  <nav>
    <a href="index.html">home</a>
    <a href="archive.html">archive</a>
    <a href="blog.html">blog</a>
    <a href="obsessions.html">obsessions</a>
      <a href="moodboard.html">mood board</a>
  </nav>
</header>

<main>
  <section class="intro">
    <h1>Archive</h1>
    <p>The complete collection.</p>
  </section>

  <div class="section-label">All photographs &amp; moving images</div>

  <section class="archive-grid" id="posts-container">
  </section>
</main>

<footer>
  <span>cusp of cancer©</span>
  <span>Made in Seattle</span>
</footer>


<div class="image-lightbox" id="image-lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <button class="image-lightbox-close" type="button" aria-label="Close image">×</button>
  <img class="image-lightbox-image" alt="">
</div>

<script>
async function loadPosts() {
  const container = document.getElementById('posts-container');

  try {
    const [postsResponse, archiveResponse] = await Promise.all([
      fetch('./content/posts.json?updated=' + Date.now()),
      fetch('https://raw.githubusercontent.com/lincolnwheeler03-art/cusp-of-cancer/main/content/moodboard-archive.json?updated=' + Date.now()).catch(() => null)
    ]);
    if (!postsResponse.ok) throw new Error('Posts not found');

    const posts = await postsResponse.json();
    let moodboardArchive = [];
    if (archiveResponse && archiveResponse.ok) {
      const archiveData = await archiveResponse.json();
      if (Array.isArray(archiveData)) moodboardArchive = archiveData;
    }

    const postImages = posts
      .filter(post =>
        ((post.type === 'photo' || post.type === 'gif') && post.image) ||
        (post.type === 'video' && post.video)
      )
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    const seenImages = new Set(postImages.map(post => post.image).filter(Boolean));
    const moodboardImages = [];
    moodboardArchive.forEach(item => {
      if (!item || !item.image || seenImages.has(item.image)) return;
      seenImages.add(item.image);
      moodboardImages.push({
        type: 'photo',
        image: item.image,
        caption: item.alt || '',
        date: item.date || '1970-01-01'
      });
    });

    const visualPosts = [...postImages, ...moodboardImages]
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    container.innerHTML = '';

    if (visualPosts.length === 0) {
      container.innerHTML = '';
      return;
    }

    visualPosts.forEach(post => {
      if (post.type === 'video' && post.video) {
        const item = document.createElement('div');
        item.className = 'archive-item';

        const video = document.createElement('video');
        video.src = post.video;
        video.controls = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.setAttribute('aria-label', post.caption || 'Cusp of Cancer video');
        if (post.poster) video.poster = post.poster;

        item.appendChild(video);
        container.appendChild(item);
        return;
      }

      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'archive-item';

      const img = document.createElement('img');
      img.src = post.image;
      img.alt = post.caption || 'Cusp of Cancer photograph';
      item.setAttribute('aria-label', 'Open image: ' + img.alt);
      img.loading = 'lazy';

      item.appendChild(img);
      container.appendChild(item);
    });

  } catch (error) {
    container.innerHTML =
      '<p class="empty-message">The collection could not be loaded.</p>';
    console.error('Could not load posts:', error);
  }
}

loadPosts();

const imageLightbox = document.getElementById('image-lightbox');
const imageLightboxImage = imageLightbox.querySelector('.image-lightbox-image');
const imageLightboxClose = imageLightbox.querySelector('.image-lightbox-close');
let lastFocusedImageButton = null;

function openImageLightbox(button) {
  const image = button.querySelector('img');
  if (!image) return;

  lastFocusedImageButton = button;
  imageLightboxImage.src = image.src;
  imageLightboxImage.alt = image.alt;
  imageLightbox.hidden = false;
  document.body.style.overflow = 'hidden';
  imageLightboxClose.focus();
}

function closeImageLightbox() {
  imageLightbox.hidden = true;
  imageLightboxImage.removeAttribute('src');
  document.body.style.overflow = '';
  if (lastFocusedImageButton && lastFocusedImageButton.isConnected) {
    lastFocusedImageButton.focus();
  }
}

document.addEventListener('click', event => {
  const button = event.target.closest('.post-image-button, .archive-item[type="button"]');
  if (button) openImageLightbox(button);
});

imageLightboxClose.addEventListener('click', closeImageLightbox);
imageLightbox.addEventListener('click', event => {
  if (event.target === imageLightbox) closeImageLightbox();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !imageLightbox.hidden) closeImageLightbox();
});

</script>

</body>
</html>
